<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <rect x="10" y="10" width="60" height="60" rx="12" fill="url(#logo-gradient)"/>
  <text x="40" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">U</text>
  
  <!-- Logo Text with Gradient -->
  <text x="85" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="url(#text-gradient)">UniBridge</text>
  <text x="85" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="url(#text-gradient)">Ghana</text>
</svg>
